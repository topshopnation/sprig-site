<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Contact | Sprig Finance</title>
  <meta name="description" content="Get in touch with the Sprig Finance team." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1E7A50;
      --green-dark: #155C3A;
      --cream: #F7F2EB;
      --text: #1A1A1A;
      --muted: #6B6B6B;
      --line: rgba(0,0,0,0.07);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    .logo-text {
      font-size: 20px;
      font-weight: 600;
      color: var(--green-dark);
      letter-spacing: -0.3px;
      text-decoration: none;
    }
    main {
      flex: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 0.5rem;
    }
    .lede {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--green-dark);
      margin-bottom: 0.35rem;
      display: block;
    }
    select, textarea, input[type="text"], input[type="email"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      font-size: 15px;
      font-family: inherit;
      border: 1.5px solid rgba(30, 122, 80, 0.25);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, textarea:focus, input[type="text"]:focus, input[type="email"]:focus { border-color: var(--green); }
    textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .checkbox-row input { width: 16px; height: 16px; }
    button[type="submit"] {
      padding: 0.85rem 1.6rem;
      font-size: 15px;
      font-weight: 600;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: var(--green-dark); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
    .status { font-size: 14px; color: var(--muted); min-height: 20px; }
    .status.success { color: var(--green-dark); font-weight: 600; }
    .status.error { color: #B3341C; }
    footer {
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--green-dark); }
  </style>
</head>
<body>
  <header>
    <a class="logo-text" href="/">Sprig Finance</a>
  </header>

  <main>
    <h1>Contact us</h1>
    <p class="lede">Questions, suggestions, or something not working right? Send it over and we'll get back to you.</p>

    <form id="contact-form">
      <div>
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div>
        <label for="subject">Subject</label>
        <select id="subject" name="topic" required>
          <option value="" disabled selected>Choose one</option>
          <option value="Help">Help</option>
          <option value="Suggestion">Suggestion</option>
          <option value="Bug Report">Bug Report</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
      </div>

      <!-- honeypot field, hidden from real people, catches basic bots -->
      <input type="text" name="botcheck" id="botcheck" style="display:none" tabindex="-1" autocomplete="off">

      <div class="checkbox-row">
        <input type="checkbox" id="not-robot" required>
        <label for="not-robot" style="margin:0; font-weight:400; color:var(--muted);">I'm not a robot</label>
      </div>

      <input type="hidden" name="access_key" value="1fc601fa-5c96-4ec0-a668-8f9daaada58f">
      <input type="hidden" name="from_name" value="Sprig Finance Contact Form">

      <button type="submit" id="submit-btn">Send message</button>
      <p class="status" id="form-status"></p>
    </form>
  </main>

  <footer>
    <a href="/">heysprig.com</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var btn = document.getElementById('submit-btn');
      var status = document.getElementById('form-status');
      var robotCheck = document.getElementById('not-robot');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!robotCheck.checked) {
          status.textContent = "Please confirm you're not a robot.";
          status.className = 'status error';
          return;
        }
        var orig = btn.textContent;
        btn.textContent = 'Sending...';
        btn.disabled = true;
        status.textContent = '';
        status.className = 'status';

        var payload = Object.fromEntries(new FormData(form));
        payload.subject = 'Sprig contact form: ' + payload.topic;
        payload.message = 'Topic: ' + payload.topic + '\n\n' + payload.message;

        fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.success) {
              form.reset();
              form.style.display = 'none';
              status.textContent = "Thanks, we got it. We'll get back to you if needed.";
              status.className = 'status success';
            } else {
              btn.textContent = orig;
              btn.disabled = false;
              status.textContent = "Hmm, that didn't go through. Please try again.";
              status.className = 'status error';
            }
          })
          .catch(function () {
            btn.textContent = orig;
            btn.disabled = false;
            status.textContent = "Hmm, that didn't go through. Please try again.";
            status.className = 'status error';
          });
      });
    })();
  </script>
</body>
</html>
